data-x="1.9500000000000002" data-y="1.9500000000000002" cx="509.1811624946967" cy="246.58464149342382" r="29.104794229953328" fill="rgba(200,40,40,0.3)" stroke="black" stroke-width="0.006012755102040817"/><circle data-type="circle" data-label="" data-x="0.325" data-y="0.325" cx="238.92235893084433" cy="516.8434450572762" r="29.104794229953328" fill="rgba(200,40,40,0.3)" stroke="black" stroke-width="0.006012755102040817"/><circle data-type="circle" data-label="" data-x="0.975" data-y="0.325" cx="347.02588035638524" cy="516.8434450572762" r="29.104794229953328" fill="rgba(200,40,40,0.3)" stroke="black" stroke-width="0.006012755102040817"/><circle data-type="circle" data-label="" data-x="0.325" data-y="0.975" cx="238.92235893084433" cy="408.7399236317353" r="29.104794229953328" fill="rgba(200,40,40,0.3)" stroke="black" stroke-width="0.006012755102040817"/><circle data-type="circle" data-label="" data-x="1.625" data-y="0.975" cx="455.12940178192616" cy="408.7399236317353" r="29.104794229953328" fill="rgba(200,40,40,0.3)" stroke="black" stroke-width="0.006012755102040817"/><circle data-type="circle" data-label="" data-x="0.975" data-y="1.625" cx="347.02588035638524" cy="300.63640220619436" r="29.104794229953328" fill="rgba(200,40,40,0.3)" stroke="black" stroke-width="0.006012755102040817"/><circle data-type="circle" data-label="" data-x="1.625" data-y="1.625" cx="455.12940178192616" cy="300.63640220619436" r="29.104794229953328" fill="rgba(200,40,40,0.3)" stroke="black" stroke-width="0.006012755102040817"/><circle data-type="circle" data-label="" data-x="0.9750000000000001" data-y="0.9750000000000001" cx="347.0258803563853" cy="408.7399236317352" r="29.104794229953328" fill="orange" stroke="black" stroke-width="0.006012755102040817"/><circle data-type="circle" data-label="" data-x="0.9750000000000001" data-y="0.9750000000000001" cx="347.0258803563853" cy="408.7399236317352" r="29.104794229953328" fill="orange" stroke="black" stroke-width="0.006012755102040817"/><text data-type="text" data-label="Diagonal ground pads / one interstitial barrel" data-x="-0.5" data-y="3.1500000000000004" x="101.71404327535004" y="47.008909630886706" fill="#164e63" font-size="14.017819261773443" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Diagonal ground pads / one interstitial barrel</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":166.3131098854476,"c":0,"e":184.87059821807384,"b":0,"d":-166.3131098854476,"f":570.8952057700467};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>